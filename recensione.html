<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lascia una recensione</title>
</head>
<body>
  <script>
    const placeId = "ChIJpUF3jBrpGRMR9n0lWfQdR6U";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = `comgooglemaps://?action=reviewplace&place_id=${placeId}`;
      setTimeout(() => {
        window.location.href = `https://search.google.com/local/writereview?placeid=${placeId}`;
      }, 1500);
    } else if (isAndroid) {
      window.location.href = `intent://maps.google.com/maps?q=place_id:${placeId}#Intent;scheme=https;package=com.google.android.apps.maps;action=android.intent.action.VIEW;end`;
      setTimeout(() => {
        window.location.href = `https://search.google.com/local/writereview?placeid=${placeId}`;
      }, 1500);
    } else {
      window.location.href = `https://search.google.com/local/writereview?placeid=${placeId}`;
    }
  </script>
  <noscript>
    <a href="https://search.google.com/local/writereview?placeid=ChIJpUF3jBrpGRMR9n0lWfQdR6U">
      Clicca qui per lasciare una recensione
    </a>
  </noscript>
</body>
</html>
