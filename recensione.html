<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lascia una recensione</title>
</head>
<body>
  <script>
    const placeId = "ChIJpUF3jBrpGRMR9n0lWfQdR6U";
    const reviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
    const isAndroid = /Android/.test(navigator.userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    let appOpened = false;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) appOpened = true;
    });

    if (isAndroid) {
      window.location.href = `intent://maps.google.com/maps?q=place_id:${placeId}#Intent;scheme=https;package=com.google.android.apps.maps;action=android.intent.action.VIEW;end`;
    } else if (isIOS) {
      window.location.href = `comgooglemaps://?action=reviewplace&place_id=${placeId}`;
    } else {
      window.location.href = reviewUrl;
    }

    setTimeout(() => {
      if (!appOpened) {
        window.location.href = reviewUrl;
      }
    }, 2000);
  </script>
</body>
</html>
