<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Genera Link Demo — Barber</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#b8965a;--gold-light:#d4b483;--black:#0a0906;
  --surface:#111009;--surface-2:#1a1712;--surface-3:#221f19;
  --off-white:#f7f3ed;--dim:#7a7060;--warm-gray:#c8bfb0;
  --green:#4ade80;
}
html{font-size:16px;height:100%}
body{
  background:var(--black);color:var(--off-white);
  font-family:'Outfit',sans-serif;font-weight:300;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 1.2rem;
  background-image:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(184,150,90,0.08),transparent);
}
.card{
  width:100%;max-width:520px;
  background:var(--surface);
  border:1px solid rgba(184,150,90,0.15);
  padding:2.5rem 2rem;
  position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:1.1rem;font-weight:400;color:var(--gold);
  letter-spacing:0.08em;margin-bottom:0.3rem;
  display:flex;align-items:center;gap:0.5rem;
}
.subtitle{
  font-size:0.65rem;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--dim);margin-bottom:2rem;
}
.field{margin-bottom:1.2rem}
.field label{
  display:block;font-size:0.58rem;letter-spacing:0.35em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem;
}
.field input{
  width:100%;background:var(--surface-2);border:1px solid rgba(184,150,90,0.15);
  color:var(--off-white);font-family:'Outfit',sans-serif;font-size:0.85rem;
  font-weight:300;padding:0.75rem 1rem;outline:none;
  transition:border-color 0.3s;
}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{
  width:100%;background:var(--gold);color:var(--black);
  border:none;padding:1rem;font-family:'Outfit',sans-serif;
  font-size:0.7rem;font-weight:700;letter-spacing:0.3em;
  text-transform:uppercase;cursor:pointer;margin-top:0.8rem;
  transition:background 0.3s;
}
.btn:hover{background:var(--gold-light)}

/* Result */
.result{
  margin-top:1.8rem;padding:1.2rem;
  background:var(--surface-2);border-left:2px solid var(--gold);
  display:none;
}
.result.show{display:block}
.result-label{
  font-size:0.55rem;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--dim);margin-bottom:0.6rem;
}
.link-box{
  display:flex;align-items:center;gap:0.8rem;
  background:var(--surface-3);padding:0.7rem 1rem;
  margin-bottom:1rem;
}
.link-text{
  flex:1;font-size:0.72rem;color:var(--gold-light);
  word-break:break-all;line-height:1.5;
}
.copy-btn{
  background:var(--gold);color:var(--black);border:none;
  padding:0.5rem 0.9rem;font-size:0.6rem;font-weight:700;
  letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;
  flex-shrink:0;transition:background 0.3s;font-family:'Outfit',sans-serif;
}
.copy-btn:hover{background:var(--gold-light)}
.copy-btn.copied{background:var(--green);color:#000}

.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:0.6rem;
  width:100%;background:#25D366;color:#fff;border:none;
  padding:0.85rem;font-family:'Outfit',sans-serif;
  font-size:0.7rem;font-weight:600;letter-spacing:0.15em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;
  transition:background 0.3s;
}
.wa-btn:hover{background:#1ebe5d}

.preview-link{
  display:block;text-align:center;margin-top:0.8rem;
  font-size:0.65rem;color:var(--dim);text-decoration:none;
  letter-spacing:0.15em;text-transform:uppercase;
  transition:color 0.3s;
}
.preview-link:hover{color:var(--gold)}

.divider{
  height:1px;background:rgba(184,150,90,0.12);
  margin:1.5rem 0;
}
.tip{
  font-size:0.68rem;color:var(--dim);line-height:1.7;
  text-align:center;margin-top:1.5rem;
}
.tip span{color:var(--gold)}
</style>
</head>
<body>

<div class="card">
  <div class="logo">✦ Barber Demo</div>
  <div class="subtitle">Generatore link personalizzato</div>

  <div class="field">
    <label>Nome Barberia *</label>
    <input type="text" id="nome" placeholder="es. Gentlemen Barber" oninput="aggiorna()"/>
  </div>

  <div class="row">
    <div class="field">
      <label>Nome Titolare</label>
      <input type="text" id="titolare" placeholder="es. Luca" oninput="aggiorna()"/>
    </div>
    <div class="field">
      <label>Collaboratore</label>
      <input type="text" id="collaboratore" placeholder="es. Marco" oninput="aggiorna()"/>
    </div>
  </div>

  <div class="field">
    <label>Indirizzo</label>
    <input type="text" id="indirizzo" placeholder="es. Via Roma 12" oninput="aggiorna()"/>
  </div>

  <div class="row">
    <div class="field">
      <label>Quartiere</label>
      <input type="text" id="quartiere" placeholder="es. Ballarò" oninput="aggiorna()"/>
    </div>
    <div class="field">
      <label>Telefono (senza +39)</label>
      <input type="text" id="tel" placeholder="es. 3491234567" oninput="aggiorna()"/>
    </div>
  </div>

  <div class="field">
    <label>Città e CAP</label>
    <input type="text" id="citta" placeholder="es. 90100 Palermo (PA)" oninput="aggiorna()"/>
  </div>

  <button class="btn" onclick="genera()">✦ Genera Link Demo</button>

  <div class="result" id="result">
    <div class="divider"></div>
    <div class="result-label">Il tuo link personalizzato</div>
    <div class="link-box">
      <div class="link-text" id="linkText">—</div>
      <button class="copy-btn" id="copyBtn" onclick="copia()">Copia</button>
    </div>
    <a class="wa-btn" id="waBtn" href="#" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Apri in WhatsApp
    </a>
    <a class="preview-link" id="previewLink" href="#" target="_blank">↗ Anteprima sito</a>
  </div>

  <p class="tip">Compila i campi e il link si genera in automatico.<br>Clicca <span>Apri in WhatsApp</span> per mandarlo direttamente.</p>
</div>

<script>
const BASE = 'https://simonetorregrossapa-maker.github.io/demo-barber';

function enc(v){ return encodeURIComponent(v.trim()); }

function buildLink(){
  var nome   = document.getElementById('nome').value.trim();
  if(!nome) return null;
  var params = [];
  params.push('nome=' + enc(nome));
  var ind  = document.getElementById('indirizzo').value.trim();
  var cit  = document.getElementById('citta').value.trim();
  var tel  = document.getElementById('tel').value.trim();
  var tit  = document.getElementById('titolare').value.trim();
  var col  = document.getElementById('collaboratore').value.trim();
  var qua  = document.getElementById('quartiere').value.trim();
  if(ind) params.push('indirizzo=' + enc(ind));
  if(cit) params.push('citta=' + enc(cit));
  if(tel) params.push('tel=' + enc(tel));
  if(tit) params.push('titolare=' + enc(tit));
  if(col) params.push('collaboratore=' + enc(col));
  if(qua) params.push('quartiere=' + enc(qua));
  return BASE + '?' + params.join('&');
}

function aggiorna(){
  var link = buildLink();
  if(!link) return;

  // Link con & normali per anteprima e copia
  document.getElementById('linkText').textContent = link;
  document.getElementById('previewLink').href = link;

  // Per WhatsApp su iPhone: & diventa %26 così il link è un token unico cliccabile
  var linkWA = link.replace(/&/g, '%26');

  var tit = document.getElementById('titolare').value.trim();
  var nome = document.getElementById('nome').value.trim();
  var saluto = tit ? tit : nome;
  var msg = 'Ciao ' + saluto + '! Ho visto la tua barberia su Google Maps 👏\n\nQuanti messaggi WhatsApp ricevi al giorno per prenotare un taglio? Con il tuo sito i clienti prenotano da soli — tu non perdi tempo e non perdi nemmeno un appuntamento.\n\nHo già preparato una demo con il tuo nome 👇\n\n' + linkWA + '\n\nTi chiamo domani per 10 minuti?';
  document.getElementById('waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
  document.getElementById('result').classList.add('show');
  document.getElementById('copyBtn').textContent = 'Copia';
  document.getElementById('copyBtn').classList.remove('copied');
}

function genera(){
  var nome = document.getElementById('nome').value.trim();
  if(!nome){ alert('Inserisci almeno il nome della barberia'); return; }
  aggiorna();
}

function copia(){
  var link = document.getElementById('linkText').textContent;
  navigator.clipboard.writeText(link).then(function(){
    var btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copiato';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = 'Copia'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
